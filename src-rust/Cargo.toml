[package]
name = "markpure"
version = "0.1.0"
description = "A WYSIWYG Markdown editor"
license = "MIT"
edition = "2021"

[dependencies]
wry = "0.46"
tao = "0.34"
rust-embed = { version = "8", features = ["mime-guess"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mt-core = { path = "../crates/mt-core" }
mt-fs = { path = "../crates/mt-fs" }
mt-markdown = { path = "../crates/mt-markdown" }
mt-export = { path = "../crates/mt-export" }
mt-search = { path = "../crates/mt-search" }
mt-bookmark = { path = "../crates/mt-bookmark" }
mt-assets = { path = "../crates/mt-assets" }
mt-spellcheck = { path = "../crates/mt-spellcheck" }
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
