[package]
name = "markpure"
version = "0.1.1"
description = "A WYSIWYG Markdown editor"
license = "MIT"
edition = "2021"

[dependencies]
wry = "0.46"
tao = "0.34"
rust-embed = { version = "8", features = ["mime-guess"] }
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mt_core = { path = "../../crates/core-lib" }
fs = { path = "../../crates/fs" }
markdown = { path = "../../crates/markdown" }
export = { path = "../../crates/export" }
search = { path = "../../crates/search" }
bookmark = { path = "../../crates/bookmark" }
assets = { path = "../../crates/assets" }
spellcheck = { path = "../../crates/spellcheck" }
walkdir = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
# P1-8: base64 decode the PNG byte stream that the frontend
# produces via `html-to-image` before writing it to disk.
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-app-kit = { version = "0.2", features = ["NSMenuItem"] }
objc2-foundation = { version = "0.2", features = ["NSString"] }
# 测试驱动器（test_driver）的快照完成回调使用 ObjC block。
block2 = "0.5"

# Windows exe 资源嵌入（图标/版本信息，见 build.rs）。刻意不加 cfg gate：
# cargo 不为非宿主 target 的依赖写 lockfile，gate 会让 Windows 上的
# --locked 构建因 lock 缺条目而失败。非 Windows 平台只是多编译一个
# 小 crate，build.rs 内部用 #[cfg] 跳过实际逻辑。
[build-dependencies]
winresource = "0.1"
