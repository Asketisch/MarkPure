[package]
name = "markdown"
version = "0.1.0"
edition = "2021"

[dependencies]
mt_core = { path = "../core-lib" }
pulldown-cmark = { version = "0.12", default-features = false, features = ["simd", "html"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
thiserror = "2"
lru = "0.12"
once_cell = "1"
# `image` is re-exported for downstream crates (PDF/DOCX export) so they
# don't need to declare a second version. We only need PNG decode/encode
# for mermaid rasterisation, so we keep the default features off.
image = { version = "0.25", default-features = false, features = ["png"] }
