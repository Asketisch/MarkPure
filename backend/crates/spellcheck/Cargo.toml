[package]
name = "spellcheck"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

# macOS-only: NSSpellChecker bridge for CJK + system-level English
# spell checking. Mirrors the pattern in
# `backend/apps/desktop/Cargo.toml` so the desktop binary's
# objc2 graph stays unified.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-app-kit = { version = "0.2", features = ["NSSpellChecker"] }
objc2-foundation = { version = "0.2", features = [
    "NSString",
    "NSArray",
    "NSRange",
    "NSValue",
    "NSOrthography",
    "NSTextCheckingResult",
] }
